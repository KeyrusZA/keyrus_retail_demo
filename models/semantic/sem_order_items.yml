version: 2

semantic_models:
  - name: order_items
    label: Order items
    description: >
      Line-item grain semantic model. Revenue metrics are defined on this
      model so they can be sliced by product category, channel and (via the
      customer entity join) province.
    model: ref('fct_order_items')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order_record
        type: foreign
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: product_category
        type: categorical
      - name: product_name
        type: categorical
      - name: channel
        type: categorical
      - name: payment_method
        type: categorical
      - name: order_status
        type: categorical

    measures:
      - name: gross_revenue_zar
        label: Gross revenue amount
        description: Sum of quantity x unit price before discounts, in ZAR.
        agg: sum
        expr: gross_amount_zar
      - name: discounts_zar
        label: Discount amount
        agg: sum
        expr: discount_zar
      - name: net_revenue_zar
        label: Net revenue amount
        description: Gross minus discounts, in ZAR.
        agg: sum
        expr: net_amount_zar
      - name: cost_zar
        label: Cost amount
        agg: sum
        expr: cost_amount_zar
      - name: items_sold
        label: Items sold
        agg: sum
        expr: quantity
