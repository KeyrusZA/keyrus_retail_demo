version: 2

semantic_models:
  - name: customers
    label: Customers
    description: >
      Customer dimension semantic model. Joined to facts by the Semantic
      Layer through the customer entity — Tableau never has to define
      this join itself.
    model: ref('dim_customers')

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: province
        type: categorical
      - name: city
        type: categorical
      - name: customer_segment
        type: categorical
